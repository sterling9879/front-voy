version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: copyintel_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-copyintel}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-password}
      POSTGRES_DB: ${DB_NAME:-copyintel_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - copyintel_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-copyintel} -d ${DB_NAME:-copyintel_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    container_name: copyintel_backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${DB_USER:-copyintel}:${DB_PASSWORD:-password}@postgres:5432/${DB_NAME:-copyintel_db}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      JWT_SECRET: ${JWT_SECRET:-your-jwt-secret-change-in-production}
      NODE_ENV: ${NODE_ENV:-development}
      PORT: 4001
    ports:
      - "4001:4001"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - copyintel_network

  frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:4001/api}
    container_name: copyintel_frontend
    restart: unless-stopped
    ports:
      - "4000:4000"
    depends_on:
      - backend
    networks:
      - copyintel_network

volumes:
  postgres_data:

networks:
  copyintel_network:
    driver: bridge
